<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fawad Sports Admin</title><style>body{font-family:Arial;margin:0;background:#07111f;color:#fff;padding:25px}input,select,textarea{padding:10px;margin:5px;background:#0e1d31;color:#fff;border:1px solid #29405c;border-radius:8px}button{padding:10px;border:0;border-radius:8px;cursor:pointer}.green{background:#4ade80}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.card{background:#0d1c30;padding:16px;border-radius:14px}.danger{background:#ef4444;color:white}</style></head><body><h1>Fawad Sports — Admin</h1><button class="green" onclick="logout()">Logout</button><h2>Add Product</h2><div class="card"><input id="name" placeholder="Product name"><select id="cat"><option>Football</option><option>Cricket</option><option>Jerseys</option><option>Shoes</option><option>Accessories</option></select><input id="price" type="number" placeholder="Price"><input id="stock" type="number" placeholder="Stock"><input id="image" placeholder="Image URL (optional)"><textarea id="desc" placeholder="Description"></textarea><br><button class="green" onclick="addProduct()">Add Product</button></div><h2>Products</h2><div id="products" class="grid"></div><h2>Orders</h2><div id="orders" class="grid"></div><script>const S=sessionStorage.admin;if(!S)location.href='/';async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-session':S};let r=await fetch(url,opt);if(r.status===401){sessionStorage.clear();location.href='/'}return r.json()}async function addProduct(){let d={name:name.value,category:cat.value,price:Number(price.value),stock:Number(stock.value),description:desc.value,image:image.value,active:true};let r=await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(r.error)return alert(r.error);location.reload()}async function load(){let ps=await api('/api/admin/products');products.innerHTML=ps.map(p=>`<div class="card"><b>${p.name}</b><p>${p.category} · Rs. ${p.price} · Stock ${p.stock}</p><button class="danger" onclick="del(${p.id})">Delete</button></div>`).join('');let os=await api('/api/admin/orders');orders.innerHTML=os.map(o=>`<div class="card"><b>Order #${o.id}</b><p>${o.customer_name} · ${o.phone}</p><p>${o.address}, ${o.city}</p><p>Rs. ${o.total.toLocaleString()} · ${o.status}</p><select onchange="status(${o.id},this.value)"><option ${o.status==='Pending'?'selected':''}>Pending</option><option>Confirmed</option><option>Packed</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></div>`).join('')}async function del(id){if(confirm('Delete product?')){await api('/api/admin/products/'+id,{method:'DELETE'});load()}}async function status(id,s){await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});load()}async function logout(){await api('/api/admin/logout',{method:'POST'});sessionStorage.clear();location.href='/'}load()</script></body></html>
