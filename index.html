<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fawad Sports</title><style>body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#eef4ff}header{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;background:#0b182a;position:sticky;top:0;z-index:3}.logo{font-size:25px;font-weight:900;color:#4ade80}.cart{background:#4ade80;color:#06110b;border:0;border-radius:12px;padding:11px 16px;font-weight:800}main{padding:35px 6%}.hero{padding:50px 0}.hero h1{font-size:clamp(38px,7vw,72px);margin:0 0 12px}.hero span{color:#4ade80}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input,.tools select{padding:13px;border-radius:10px;border:1px solid #29405c;background:#0e1d31;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#0d1c30;border:1px solid #203651;border-radius:18px;overflow:hidden}.pic{height:190px;background:#122942;display:grid;place-items:center;font-size:64px}.body{padding:16px}.price{font-size:20px;font-weight:900;color:#4ade80}.add{width:100%;padding:12px;border:0;border-radius:10px;background:#4ade80;font-weight:800;cursor:pointer}.admin{margin-top:45px;padding:25px;border-radius:18px;background:#0b182a}.hidden{display:none}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:9}.box{background:#0d1c30;padding:25px;border-radius:18px;width:min(92%,500px)}.box input,.box textarea,.box select{width:100%;box-sizing:border-box;margin:7px 0;padding:11px;border-radius:9px;border:1px solid #29405c;background:#081426;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{cursor:pointer}@media(max-width:600px){header{padding:15px 4%}main{padding:25px 4%}}</style></head><body><header><div class="logo">FAWAD SPORTS</div><button class="cart" onclick="openCart()">Cart (<span id="count">0</span>)</button></header><main><section class="hero"><h1>Gear up. <span>Play hard.</span></h1><p>Football, cricket, jerseys, shoes and sports accessories.</p></section><div class="tools"><input id="search" placeholder="Search products..." oninput="render()"><select id="cat" onchange="render()"><option>All</option><option>Football</option><option>Cricket</option><option>Jerseys</option><option>Shoes</option><option>Accessories</option></select></div><section id="products" class="grid"></section><section class="admin"><h2>Admin</h2><p>Secure product/order dashboard is included in this project.</p><button class="cart" onclick="adminLogin()">Open Admin</button></section></main><div id="modal" class="modal hidden"><div class="box" id="box"></div></div><script>let products=[],cart=JSON.parse(localStorage.cart||'[]');async function load(){products=await (await fetch('/api/products')).json();render();update()}function render(){let q=document.querySelector('#search').value.toLowerCase(),c=document.querySelector('#cat').value;document.querySelector('#products').innerHTML=products.filter(p=>(c==='All'||p.category===c)&&p.name.toLowerCase().includes(q)).map(p=>`<article class="card"><div class="pic">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover">`:'⚽'}</div><div class="body"><b>${esc(p.name)}</b><p>${esc(p.description||'')}</p><div class="price">Rs. ${p.price.toLocaleString()}</div><small>Stock: ${p.stock}</small><br><br><button class="add" onclick="add(${p.id})">Add to Cart</button></div></article>`).join('')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function add(id){let x=cart.find(i=>i.id===id);if(x)x.qty++;else cart.push({id,qty:1});localStorage.cart=JSON.stringify(cart);update()}function update(){document.querySelector('#count').textContent=cart.reduce((a,b)=>a+b.qty,0)}function openCart(){document.querySelector('#modal').classList.remove('hidden');document.querySelector('#box').innerHTML='<h2>Your Cart</h2>'+cart.map(i=>{let p=products.find(x=>x.id===i.id);return p?`<p>${esc(p.name)} × ${i.qty} — Rs. ${(p.price*i.qty).toLocaleString()}</p>`:''}).join('')+'<hr><button class="add" onclick="checkout()">Checkout / WhatsApp</button><div class="row"><button onclick="closeM()">Close</button></div>'}function checkout(){if(!cart.length)return alert('Cart is empty');document.querySelector('#box').innerHTML='<h2>Checkout</h2><input id="n" placeholder="Full name"><input id="ph" placeholder="Phone"><input id="a" placeholder="Address"><input id="city" placeholder="City"><textarea id="note" placeholder="Notes (optional)"></textarea><button class="add" onclick="place()">Place COD Order</button>'}async function place(){let payload={customer_name:n.value,phone:ph.value,address:a.value,city:city.value,notes:note.value,items:cart};let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let d=await r.json();if(!r.ok)return alert(d.error);cart=[];localStorage.cart='[]';update();location.href=d.whatsapp}function closeM(){modal.classList.add('hidden')}async function adminLogin(){modal.classList.remove('hidden');box.innerHTML='<h2>Admin Login</h2><input id="u" placeholder="Username"><input id="pw" type="password" placeholder="Password"><button class="add" onclick="login()">Login</button>'}async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:pw.value})});let d=await r.json();if(!r.ok)return alert(d.error);sessionStorage.admin=d.session;location.href='/admin.html'}load();</script></body></html>
